<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>surf-bhop</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#eee;font-family:system-ui,Segoe UI,sans-serif}
canvas{display:block}
#hud{position:fixed;top:8px;left:10px;font:12px/1.4 monospace;pointer-events:none;white-space:pre;text-shadow:0 1px 3px #000;z-index:5}
#speed{position:fixed;left:50%;top:58%;transform:translateX(-50%);font:600 22px/1 monospace;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none;z-index:5}
#run{position:fixed;top:10px;left:50%;transform:translateX(-50%);font:600 16px/1 monospace;color:#fff;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:4px;pointer-events:none;z-index:5}
#run:empty,#msg:empty{display:none}
#msg{position:fixed;top:30%;left:50%;transform:translateX(-50%);font:700 26px/1.2 system-ui,sans-serif;color:#ffd27a;text-shadow:0 2px 6px #000;pointer-events:none;z-index:5}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#fff;border-radius:50%;box-shadow:0 0 2px #000;pointer-events:none;z-index:5}
body[data-mode=edit] #cross{width:14px;height:14px;margin:-7px 0 0 -7px;background:none;border:2px solid #4f8;border-radius:0;box-sizing:border-box}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,10,20,.55);cursor:pointer;user-select:none;text-align:center;white-space:pre-line;font-size:18px;line-height:1.6;z-index:1}
body[data-mode=edit] #lock{right:250px}
#lock.hidden{display:none}
#lock{flex-direction:column;gap:22px}
#lockText{font-size:17px}
#menu{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:960px}
#modes,#maps{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#modes button{width:240px;padding:10px 12px;background:rgba(30,22,30,.85);border:1px solid #6b4a55;border-radius:8px;color:#f3e9e4;cursor:pointer;font:inherit;text-align:left;display:flex;flex-direction:column;gap:3px;white-space:normal}
#modes button.on{background:#c23b22;border-color:#ffd27a}
#modes button b{font-size:18px}#modes small{font-size:12px;color:#ead9dd}
#menu .hint{font-size:14px;background:rgba(20,16,24,.82);padding:12px 18px;border-radius:8px;line-height:1.6}
#menu .hint button{margin-top:8px;padding:6px 14px;background:#3b6;border:0;border-radius:4px;cursor:pointer;font:inherit;font-weight:600}
#maps button{white-space:normal;width:190px;padding:12px 10px;background:rgba(20,16,24,.82);border:1px solid #5a3c46;border-radius:6px;color:#f3e9e4;cursor:pointer;font:inherit;text-align:left;display:flex;flex-direction:column;gap:3px}
#maps button:hover{border-color:#e7a1b8;background:rgba(40,24,34,.9)}
#maps button.on{border-color:#ffd27a;box-shadow:0 0 0 1px #ffd27a inset}
#menu b{font-size:17px}#menu small{font-size:12px;color:#cdb8bf}#menu .t{color:#ffb7c9;font-size:13px;letter-spacing:2px}
#panel{display:none;position:fixed;top:0;right:0;width:250px;height:100%;box-sizing:border-box;padding:10px;background:rgba(12,16,24,.94);font-size:12px;overflow:auto;z-index:10;border-left:1px solid #2a3442}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
#panel input[type=number],#panel select{width:110px;background:#1b222c;color:#eee;border:1px solid #3a4656;padding:2px 4px}
#panel input:disabled,#panel select:disabled{opacity:.35}
#panel .row{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
#panel button{flex:1;background:#243040;color:#eee;border:1px solid #3a4a5e;padding:4px 6px;cursor:pointer;font:inherit;border-radius:3px}
#panel button:hover{background:#2e3d52}
#panel button.on{background:#3b6;color:#000;border-color:#3b6}
#sw span{width:22px;height:22px;border-radius:3px;cursor:pointer;border:2px solid transparent}
#sw span.on{border-color:#fff}
#chk{margin:6px 0;padding:4px;border-radius:3px;font-weight:600}
#chk.ok{background:#1d4a2c;color:#8f8}#chk.bad{background:#4a1d1d;color:#f99}
#panel pre{font-size:11px;color:#9ab;white-space:pre-wrap;line-height:1.5}</style></head>
<body data-mode="play">
<div id="hud"></div>
<div id="speed"></div>
<div id="run"></div>
<div id="msg"></div>
<div id="cross"></div>
<div id="lock"><div id="lockText"></div><div id="menu"></div></div>
<script type="module" src="/src/main.js"></script>
</body></html>
